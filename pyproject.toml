[project]
name = "astrarh"
version = "0.1.0"
description = "AstraRH: one HR ecosystem from hire to retain, on a shared trust layer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "boto3>=1.40",
    "fastapi>=0.115",
    "httpx>=0.27",
    "neo4j>=5.26,<6",
    "pgvector>=0.3",
    "procrastinate>=3",
    "pydantic>=2.9",
    "pyjwt>=2.10",
    "python-multipart>=0.0.18",
    "pyyaml>=6",
    "sqlalchemy>=2.0.36",
    "tzdata>=2024.1",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "opentelemetry-instrumentation-logging>=0.51b0",
    "opentelemetry-sdk>=1.30",
    "psycopg[binary]>=3.2",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
# Parsing and embedding libraries are added here in Phase 4.
ml = [
    "fastembed>=0.5",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "pytesseract>=0.3.13",
    "python-docx>=1.1",
    "python-multipart>=0.0.18",
]
# Only the worker image gets LLM and agent libraries.
worker = [
    "anthropic>=0.60",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2",
    "openai>=1.60",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S608"]
"packages/**/migrations/versions/*" = ["E501", "I001"]
"packages/kernel/graph/__init__.py" = ["S608"]
"packages/kernel/ai/guard.py" = ["E501"]
"packages/packs/talent/blind.py" = ["S105"]
"packages/packs/talent/signals.py" = ["S608"]
"packages/packs/talent/evals/*" = ["S608"]
"tools/*" = ["E501", "S311"]
"packages/kernel/comms/__init__.py" = ["E501"]
"packages/packs/talent/communications.py" = ["E501"]
"packages/kernel/knowledge/__init__.py" = ["S608"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
pythonpath = [".", "packages"]
