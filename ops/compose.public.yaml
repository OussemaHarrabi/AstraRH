# Public overlay: the production stack, reachable through one HTTPS link.
# Inbound traffic comes only through this outbound tunnel, and only to Caddy. The container sits on
# the edge network alone and holds no secrets, so it can't reach data, files, models or mail.
services:
  tunnel:
    image: cloudflare/cloudflared:2025.10.1@sha256:21f3607baf2384c54d592b0efe76dd5f548c0dbc083e62fa22c7fac3923d077f
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://caddy:80"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [edge_public]
    depends_on:
      caddy: { condition: service_started }
    mem_limit: 128m
